
name: Update BTC Candle Data

on:
  schedule:
    # Daily candle update: 09:15 KST
    - cron: '15 0 * * *'

    # 4h updates: 00:15, 04:15, 08:15,
    # 12:15, 16:15, 20:15 KST
    - cron: '15 3,7,11,15,19,23 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-candle-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update daily candles
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * *'
        run: python fetch_btc.py

      - name: Update 4-hour candles
        run: python fetch_btc_4h.py

      - name: Check BTC alerts
        run: python check_btc_alerts.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add btc_daily.json btc_4h.json btc_alerts.json

          if ! git diff --cached --quiet; then
            git commit -m "Update BTC candle data and alerts"
            git push
          fi
