
name: Update BTC Candle Data

on:
  schedule:
    # Daily candle updates: 09:15, 09:25, 10:15 KST
    - cron: '15,25 0 * * *'
    - cron: '15 1 * * *'

    # 4h updates: every hour at :15 and :45
    - cron: '15,45 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-candle-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update daily candles
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15,25 0 * * *' || github.event.schedule == '15 1 * * *'
        run: python fetch_btc.py

      - name: Update 4-hour candles
        run: python fetch_btc_4h.py

      - name: Check BTC alerts
        run: python check_btc_alerts.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add btc_daily.json btc_4h.json btc_alerts.json

          if ! git diff --cached --quiet; then
            git commit -m "Update BTC candle data and alerts"
            git push
          fi

